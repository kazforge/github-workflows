name: Documentation revisions

on:
  workflow_call:
    inputs:
      app-client-id:
        required: true
        type: string
    secrets:
      app-private-key:
        required: true

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !github.event.deleted && !github.event.forced
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.scope.outputs.tag }}
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: product
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          path: shared
      - id: scope
        working-directory: product
        env:
          BEFORE: ${{ github.event.before }}
        run: bash ../shared/scripts/docs-revisions.sh prepare

  publish:
    needs: prepare
    if: needs.prepare.outputs.mode != ''
    runs-on: ubuntu-latest
    concurrency:
      group: docs-${{ github.repository }}-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: product
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          path: shared
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            jsonapi-docs
          permission-contents: write
      - name: Append verified revision and notify Portal
        working-directory: product
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DOCS_TAG: ${{ needs.prepare.outputs.tag }}
          MODE: ${{ needs.prepare.outputs.mode }}
        run: bash ../shared/scripts/docs-revisions.sh publish
